# Shared synthetic data generator: truth has one finite layer and a halfspace.
[model]
depth = [0.0, 1.5]
vs = [1.0, 2.3]
vp = [1.8, 4.14]
rho = [2.3, 2.3]
[queries]
frequency_hz = [0.15, 0.2, 0.3, 0.4, 0.6, 0.9]
mode = [0, 0, 0, 0, 0, 0]
[inversion]
lower_vs = [0.8, 0.8]
upper_vs = [2.7, 2.7]
starts_vs = [[1.2, 2.1], [0.9, 2.5], [1.4, 1.9], [1.1, 2.4]]
vp_vs_ratio = 1.8
sensitivity = "implicit"
max_iterations = 100
gradient_tolerance = 0.00001
[synthetic]
sigma_km_s = 0.03
correlation = 0.2
add_noise = true
seed = 2026

# K includes the halfspace. Z limits interface positions, not halfspace thickness.
[rj_prior]
min_layers = 1
max_layers = 4
depth_limit = 5.0
min_spacing = 0.3
vs_lower = 0.8
vs_upper = 2.7
layer_weights = [1.0, 1.0, 1.0, 1.0]
[rj_physics]
vp_vs_ratio = 1.8
density = 2.3
[rjmcmc]
warmup = 100
draws = 200
vs_step = 0.08
interface_step = 0.2
seed = 2026
[[rj_starts]]
interfaces = []
vs = [1.8]
[[rj_starts]]
interfaces = [1.8]
vs = [1.2, 2.1]
[[rj_starts]]
interfaces = [1.0, 2.5]
vs = [1.1, 1.6, 2.4]

[[rj_starts]]
interfaces = [0.8, 1.8, 3.2]
vs = [1.0, 1.4, 1.9, 2.4]

# Workflow smoke budgets only; not a convergence configuration.
[nuts]
prior = "uniform_vs"
metric_adaptation = "diagonal"
warmup = 100
draws = 100
max_depth = 6
step_size = 0.03
target_accept = 0.95
adapt_step_size = true
seed = 2026
mass = [[100.0, 0.0], [0.0, 100.0]]
